<!DOCTYPE html>

<html>

<head>

    >

</head>

<body>

    <div class="form-page">

                <h1>
                    🔍 Search Customer

                </p>

            </div>


            <div class="search-box">

               <input
    type="text"

    placeholder="Enter ID, Name, Phone or Email"
>

<button onclick="searchCustomer()">
    Search Customer
</button>
                </button>

            </div>


            <div id="searchResult">

            </div>


            <div class="button-group">

                <button
                    class="back-btn"
                    onclick="window.location.href='home.html'"
                >
                    Back to Dashboard
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
